name: PR Checks

# Regression gate for every pull request. Modeled on cuplivo's pr-check.yml
# (format + l10n + analyze + test on each PR), adapted to this repo:
#   * compileReleaseKotlin — type-checks main sources (fast fail before tests)
#   * testReleaseUnitTest — the full JVM suite (only variant; debug is
#     disabled via androidComponents, see app/build.gradle.kts)
#   * check_new_untranslated.py — rejects PRs that add a user-visible
#     string without translating it into every shipped locale.
#   * check_announced_tools.py — a tool NAMED by a prompt fragment must be in
#     the core schema (alwaysOn), never behind find_tools.
# The heavy assemble/NDK/sandbox-assets path stays in android-apk.yml; this
# workflow deliberately avoids it so PR feedback stays under ~20 minutes.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Build number of the command-line tools zip: was inline in the download URL,
  # exposed so the SDK cache key invalidates when it changes.
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  checks:
    name: Compile / Unit tests / L10n gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the l10n diff against the PR base works.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Restore Android SDK cache
        uses: actions/cache@v4
        # A corrupt/unrestorable archive must not gate the PR: Install Android
        # SDK below provisions the full toolchain unconditionally (against a
        # restored tree sdkmanager no-ops via package.xml), so a failed restore
        # only costs a fresh download. Empirically: the archive saved
        # 2026-11-16 16:31 fails every restore with "tar: Cannot utime/change
        # mode: Operation not permitted" on ~51k files under
        # /usr/local/lib/android/sdk (runner overlay metadata issue) and failed
        # 5 consecutive PR runs before any code was compiled.
        continue-on-error: true
        with:
          # setup-java's `cache: gradle` only covers ~/.gradle — the platform and
          # build-tools were re-downloaded on every PR. Key names both pinned
          # versions plus the command-line tools build, so a toolchain bump in
          # `env` misses instead of restoring an outdated SDK.
          # sdkmanager below stays unconditional: against restored packages it
          # reads package.xml and no-ops, so nothing about the installed
          # toolchain changes.
          path: |
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/licenses
          key: prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-bt-${{ env.ANDROID_BUILD_TOOLS }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS }}
          restore-keys: |
            prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-bt-${{ env.ANDROID_BUILD_TOOLS }}-
            prcheck-android-sdk-${{ runner.os }}-platform-${{ env.ANDROID_PLATFORM }}-

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          # sudo dropped deliberately: the cached dirs must stay owned by the
          # runner user or actions/cache cannot extract into them on a hit, and
          # android-apk.yml already writes to this exact path unprivileged.
          if [ ! -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            # A failed cache restore can leave a partially extracted tree
            # (content present, modes unrestored): clear it so the mv below
            # replaces `latest` instead of nesting the new dir inside it.
            rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.ANDROID_CMDLINE_TOOLS }}_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/sdk
            mv /tmp/sdk/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          fi
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Compile Kotlin (release variant)
        working-directory: src/android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # Phone-tuned gradle.properties leaks into CI: 2g Kotlin daemon OOMs
          # on cold compile, workers.max=1 neuters --parallel. See android-apk.yml.
          sed -i 's|org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|kotlin.daemon.jvmargs=.*|kotlin.daemon.jvmargs=-Xmx4g|' gradle.properties
          sed -i 's|org.gradle.workers.max=.*|org.gradle.workers.max=4|' gradle.properties
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --parallel --stacktrace

      - name: Unit tests (release variant)
        working-directory: src/android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app:testReleaseUnitTest --parallel --stacktrace

      # [T-schema-drift] Hand-written migration DDL must agree with the
      # exported Room schema: an index created by a migration but undeclared
      # on the entity crashes RoomOpenHelper.onUpgrade — after the migration
      # ran, taking down the whole app. SchemaMigrationDriftTest covers this
      # inside the unit-test job above; this standalone replay gives a
      # two-second local check with the same verdict before any gradle work.
      # [T-verify-all] 单入口。逐条 step 保留（日志归属清晰），但本地与 CI
      # 必须能一条命令跑完全部静态守卫，否则「改完自己没跑全」是常态。
      # 这一步同时暴露静态检查（括号/引号配平），逐条 step 里没有对应项。
      - name: All static gates (single entry)
        run: python3 scripts/ci/verify_all.py -j 4

      - name: Migration DDL matches exported schema
        run: python3 scripts/ci/check_schema_drift.py

      - name: No new untranslated strings
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/ci/check_new_untranslated.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}"

      # [T-string-refs] The gate above checks locale coverage for keys that
      # exist in values/strings.xml; it is blind to the other direction — a key
      # a Kotlin file references that nobody ever defined. That mismatch only
      # surfaces in the Kotlin compile step, which is the slowest gate in this
      # job and runs before every cheap one, so a renamed key costs a whole
      # compile round to discover. Runs on every event (tree state, not diff).
      - name: String resource references resolve
        run: python3 scripts/ci/check_string_refs.py

      # [T-ui-cjk-ratchet] The l10n gate only sees strings.xml. Freeze the
      # existing hardcoded Chinese literals in ui/ and reject any new/growing
      # file (25 files / 100 literals at adoption).
      - name: No new hardcoded CJK in UI
        run: python3 scripts/ci/check_cjk_literals.py

      # [T-thinking-level-i18n] UI must not consume ThinkingLevel.displayName
      # (hard-coded English — it shipped an English-only picker inside a
      # Chinese UI); use ThinkingLevel.localizedName(context). Ratchet.
      - name: ThinkingLevel displayName UI ratchet
        run: python3 scripts/ci/check_thinking_displayname_ui.py

      # [T-arch-ratchet] UI review report P2-2: oversized files are on a
      # one-way diet. Baseline ceilings never rise; new files cap at 800
      # lines. Runs on every event (tree state, not diff state).
      - name: Architecture policy ratchet
        run: python3 scripts/ci/check_architecture_policy.py

      # [T-tool-execution-ledger] Structural ratchet: both execution lanes
      # must route through ToolExecutionLedger.executeOnce BEFORE dispatching
      # a side effect. #330 regressed on the spawn lane (awaitAll of
      # executeRunSubAgent, then ledger.reuse()) which launched a second wave
      # for a replayed call. Cheap tree-state check + Python state-machine
      # replica; runs on every event so main pushes are covered too.
      - name: Tool single-execution contract (both lanes)
        run: python3 scripts/ci/check_tool_execution_contract.py

      # [T-preanchor-dynamic-budget / T-tool-title-single-source GH#344]
      # Structural ratchet: the corridor stays in one pure function (40k
      # ceiling, 20% window, 8k floor) and every tool-card title flows
      # through resolveToolTitle / displayToolTitle.
      - name: preAnchor budget + tool title contract
        run: python3 scripts/ci/check_tool_title_and_budget_contract.py

      # [T-prefs-registry] config/PrefsRegistry.kt is generated but it *decides*
      # the key-name guard on every typed prefs read/write. If prefs source
      # changed without re-running the generator, the register drifts and the
      # guard starts rejecting live code (or silently letting junk through) —
      # a runtime failure with no compile-time signal.
      - name: Submodule mapping is consistent
        run: python3 scripts/ci/check_submodule_mapping.py

      - name: Prefs registry matches source
        run: python3 scripts/ci/check_prefs_registry.py

      # [T-prefs-calls] The registry check above proves the generated file
      # matches source — not that the generator attributed each key to the
      # RIGHT prefs file. A key filed under the wrong name still generates
      # cleanly, still compiles, then throws at runtime:
      #   key 'chat.confirmBeforeStop' is not registered in PrefsRegistry
      #   for appearance_prefs
      # This check bypasses the generator's attribution and matches call sites
      # against each file's own key list, so it catches the attribution itself.
      - name: Prefs call sites use registered keys
        run: |
          python3 scripts/ci/check_prefs_call_sites.py --selftest
          python3 scripts/ci/check_prefs_call_sites.py

      # [T-prefs-encryption] `Prefs.file(name)` decides encrypted-vs-plain from
      # the REGISTRY, not from the call site. So migrating a file from
      # `EncryptedPrefsFactory.safeCreate(ctx, "x")` to `Prefs.file("x")` erases
      # the only evidence the generator used to see — the file silently becomes
      # PLAIN, every other check still passes, and credentials start landing in
      # a cleartext XML. Measured: minis_network_secrets and
      # backup_rclone_secrets were downgraded exactly this way in one migration.
      # Pinned names may only be added, never removed.
      - name: Encrypted prefs are not silently downgraded
        run: python3 scripts/ci/check_prefs_encryption.py

      # [T-prefs-api] PrefsHandle (int/bool/set/observe) and SharedPreferences
      # (getInt/getBoolean/edit) share almost no method names. A migration that
      # renames the call but leaves the receiver's declared type behind (or the
      # reverse) fails as "unresolved reference: int" AT THE CALL SITE, which
      # points at the symptom instead of the declaration.
      - name: Prefs receivers match their API
        run: python3 scripts/ci/check_prefs_api_usage.py

      # [T-ui-tokens] MinisTokens.kt aggregates every Color(0x...) literal in
      # ui/. Stale tokens fail at the call site (unresolved reference), which
      # reads like a normal typo rather than "the generator was not re-run".
      - name: UI design tokens are regenerable
        run: python3 scripts/ci/check_ui_tokens.py

      # [T-token-coverage] The generator proves the token file matches source;
      # it says nothing about whether code *uses* the tokens. Measured: 284
      # unnamed color literals, 0 unnamed sp, 3488 unnamed dp remain. Without
      # a ratchet those counts only grow — writing 16.sp is always cheaper than
      # finding the semantic slot, so the table drifts into decoration. Budget is
      # per-file (a total hides "A removed 20, B added 20") and may only go down.
      - name: Design token coverage ratchet
        run: |
          python3 scripts/ci/check_token_coverage.py --selftest
          python3 scripts/ci/check_token_coverage.py

      # [T-token-semantics] The generator proves MinisTokens.kt matches source;
      # it says nothing about whether the Light/Dark pair is *correct*. A slot
      # copied from Light into Dark, a swapped background, or a text color that
      # silently drops under 4.5:1 all compile and all render wrong — the first
      # one only in dark mode, which CI screenshots never show.
      - name: Design token semantics (dark parity, contrast)
        run: python3 scripts/ci/check_token_semantics.py

      # [T-composition-local-wire] A declared CompositionLocal with no
      # `provides` anywhere keeps its default forever. PR #126 shipped exactly
      # that (provider mounted, no consumer) and called it a fix; the token
      # layer hit the mirror-image version (consumer, no provider). Both are
      # invisible at compile time and mostly invisible at runtime.
      - name: CompositionLocals are all provided
        run: python3 scripts/ci/check_composition_locals.py

      # [T-token-scope] The layering guard above proves every CompositionLocal has
      # a provider; it says nothing about *where* the token readers are called.
      # `MinisTypography.body` is `@Composable`-only, and `remember {}` marks its
      # lambda `@DisallowComposableCalls` — so `remember { MinisTypography.body }`
      # throws at runtime. The nastier half: remember's lambda only runs on a
      # cache miss, so the bug hides under incremental builds and detonates on
      # the first cold start or font-scale change. Measured while migrating 13.sp
      # (this guard found one live instance in CodeEditorField). inline lambdas
      # (forEach / let / run) are NOT flagged — composable context does flow
      # through them, and false positives are how a guard gets switched off.
      - name: Token readers stay out of non-composable lambdas
        run: |
          python3 scripts/ci/check_token_scope.py --selftest
          python3 scripts/ci/check_token_scope.py

      # [T-token-runtime-probe] The two checks above are static. This one
      # actually compiles MinisTokens.kt on a plain JVM and asserts the values:
      # dark surfaces really are darker, diff colors point the right way, text
      # clears 4.5:1. It caught Light.diffAddedText sitting at 3.52:1 on day one.
      # Needs kotlinc; the script self-skips when it is absent.
      - name: Design token runtime probe
        run: bash scripts/ui/probe/run_probe.sh

      # [T-announced-tools-core] The plan board fragment told the model to
      # "advance items with agent_plan" while agent_plan was long-tail, so the
      # board the user watched could never move (and could never be created:
      # only sub-agent dispatch filed entries). Same class of drift: cronjob /
      # evolution / search_sessions / read_session announced by prompt
      # fragments but absent from alwaysOn. A fragment that names a tool is an
      # instruction — find_tools only helps a model that already suspects the
      # tool exists. Runs on every event (tree state, not diff state).
      - name: Announced tools are in the core schema
        run: python3 scripts/ci/check_announced_tools.py

      # [T-mcp-stdio-bridge] The stdio bridge exists twice on purpose: the
      # source under scripts/mcp (what the suite drives) and the copy installed
      # into the guest default mount (what a client actually spawns). Drift
      # between them means a bridge nobody tested is the one clients run, so
      # the gate runs the suite and then diffs the generated copies.
      - name: MCP stdio bridge (tests + asset sync)
        run: |
          python3 scripts/mcp/test_minis_mcp_stdio.py
          python3 scripts/mcp/sync_stdio_to_assets.py --check
