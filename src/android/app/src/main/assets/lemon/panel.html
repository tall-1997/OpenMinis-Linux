<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小柠檬 · 工具面板</title>
<style>
  :root{
    --bg:#0b0b0c; --card:#1c1c1e; --card2:#242426; --line:rgba(255,255,255,.09);
    --t1:#fff; --t2:#8e8e93; --t3:#5a5a5e;
    --accent:#ffc53d; --green:#00d084; --blue:#0a84ff; --red:#ff5a5f;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;background:var(--bg);color:var(--t1);
    font:15px/1.45 -apple-system,"SF Pro Text","Noto Sans SC",system-ui,sans-serif;
    padding:0 0 env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:9;background:rgba(11,11,12,.92);
    backdrop-filter:blur(12px);border-bottom:.5px solid var(--line);
    padding:12px 14px 10px}
  h1{margin:0 0 8px;font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px}
  h1 small{font-weight:400;color:var(--t2);font-size:12px}
  .bar{display:flex;gap:8px}
  input,select,button{font:inherit;color:var(--t1)}
  input[type=search]{flex:1;background:var(--card2);border:.5px solid var(--line);
    border-radius:10px;padding:9px 12px;outline:none;min-width:0}
  select{background:var(--card2);border:.5px solid var(--line);border-radius:10px;
    padding:9px 10px;outline:none;max-width:42%}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card2);border:.5px solid var(--line);
    border-radius:9px;padding:5px 10px;font-size:12px;color:var(--t2);cursor:pointer}
  .chip.on{background:rgba(255,197,61,.16);border-color:rgba(255,197,61,.4);color:var(--accent)}
  .chip b{color:var(--t3);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
  main{padding:12px 14px 40px}
  .count{color:var(--t2);font-size:12px;margin:0 0 8px}
  .tool{background:var(--card);border:.5px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:8px;cursor:pointer;position:relative}
  .tool:active{background:var(--card2)}
  .tool .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .nm{font:600 14px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--t2)}
  .risk{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .risk.low{color:var(--green);background:rgba(0,208,132,.13)}
  .risk.medium{color:var(--accent);background:rgba(255,197,61,.13)}
  .risk.high{color:var(--red);background:rgba(255,90,95,.13)}
  .ds{color:var(--t2);font-size:12.5px;margin-top:5px;line-height:1.4}
  .empty,.load{color:var(--t3);text-align:center;padding:40px 0;font-size:13px}
  /* sheet */
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
  #mask.show{display:block}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
    border-radius:18px 18px 0 0;transform:translateY(100%);transition:.22s ease;
    max-height:86vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
  #sheet.show{transform:translateY(0)}
  #sheet h2{margin:0 0 4px;font-size:16px;font-weight:650;word-break:break-all;
    font-family:ui-monospace,Menlo,monospace}
  #sheet .sub{color:var(--t2);font-size:12.5px;margin-bottom:12px}
  .banner{padding:9px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;margin-bottom:12px}
  .banner.ok{background:rgba(0,208,132,.12);color:var(--green)}
  .banner.warn{background:rgba(255,197,61,.12);color:var(--accent)}
  .banner.info{background:rgba(10,132,255,.12);color:#5aa9ff}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--card2);
    border:.5px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
  .fld textarea{min-height:74px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .req{color:var(--red)}
  .btns{display:flex;gap:9px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:11px;padding:12px;font-weight:600;font-size:14px}
  .btn.ghost{background:var(--card2);color:var(--t1)}
  .btn.go{background:var(--accent);color:#1a1200}
  .btn:disabled{opacity:.45}
  pre{background:var(--card2);border:.5px solid var(--line);border-radius:10px;
    padding:11px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;
    word-break:break-word;max-height:34vh;overflow:auto;margin:12px 0 0;color:#c9c9ce}
</style>
</head>
<body>
<header>
  <h1>小柠檬 <small id="meta">连接中…</small></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="搜索工具名 / 说明…" autocomplete="off">
    <select id="frisk"><option value="">全部风险</option><option value="low">只读 low</option><option value="medium">medium</option><option value="high">high</option></select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <p class="count" id="count">—</p>
  <div id="list" class="load">加载中…</div>
</main>

<div id="mask" onclick="closeSheet()"></div>
<section id="sheet">
  <h2 id="sname"></h2>
  <div class="sub" id="sdesc"></div>
  <div class="banner" id="sbanner"></div>
  <div id="sform"></div>
  <div class="fld" id="sreasonWrap" style="display:none">
    <label>执行原因 <span class="req">*</span>（进审计）</label>
    <input id="sreason" placeholder="写清楚为什么要跑它" autocomplete="off">
  </div>
  <div class="btns">
    <button class="btn ghost" onclick="closeSheet()">取消</button>
    <button class="btn go" id="sgo" onclick="run()">执行</button>
  </div>
  <pre id="sres" style="display:none"></pre>
</section>

<script>
// 面板跑在 App 的 assets 里，走的是 App 自己内嵌的 MCP 服务。
// 默认端口来自 McpHttpServer.DEFAULT_PORT = 8765，可用 ?port= 覆盖。
const PORT = new URLSearchParams(location.search).get('port') || '8765';
const ENDPOINT = 'http://127.0.0.1:' + PORT + '/mcp';
let TOOLS = [], COUNTS = [], DOM = '', NID = 1;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function rpc(method, params) {
  const r = await fetch(ENDPOINT, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({jsonrpc: '2.0', id: NID++, method, params: params || {}})
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'rpc error');
  return j.result;
}
const callTool = (name, args) => rpc('tools/call', {name, arguments: args || {}});
const textOf = res => (res && res.content && res.content[0] && res.content[0].text) || '';

async function loadCatalog() {
  try {
    const res = await callTool('lemon_list', {limit: 400});
    const body = JSON.parse(textOf(res));
    TOOLS = body.tools || [];
    COUNTS = body.domains || [];
    $('meta').textContent = body.total + ' 个工具';
    buildChips();
    render();
  } catch (e) {
    $('list').className = 'empty';
    $('list').textContent = '连不上内嵌 MCP 服务（' + ENDPOINT + '）。请到 设置 → MCP 打开服务后重试。';
    $('meta').textContent = '未连接';
  }
}

function buildChips() {
  const total = COUNTS.reduce((a, c) => a + c.count, 0);
  $('chips').innerHTML =
    '<span class="chip ' + (DOM === '' ? 'on' : '') + '" onclick="setDom(\'\')">全部<b>' + total + '</b></span>' +
    COUNTS.map(c => '<span class="chip ' + (DOM === c.domain ? 'on' : '') + '" onclick="setDom(\'' + esc(c.domain) + '\')">' +
      esc(c.domain) + '<b>' + c.count + '</b></span>').join('');
}

function setDom(d) { DOM = d; buildChips(); render(); }

function render() {
  const q = $('q').value.trim().toLowerCase();
  const fr = $('frisk').value;
  const list = TOOLS.filter(t =>
    (!DOM || t.domain === DOM) &&
    (!fr || t.risk === fr) &&
    (!q || t.name.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q)));
  $('count').textContent = '共 ' + list.length + ' 项' + (list.length !== TOOLS.length ? '（已筛选）' : '');
  $('list').className = '';
  $('list').innerHTML = list.length ? list.map(t =>
    '<div class="tool" onclick="openTool(\'' + esc(t.name) + '\')">' +
      '<div class="top"><span class="nm">' + esc(t.name) + '</span>' +
      '<span class="risk ' + t.risk + '">' + t.risk + (t.ro ? ' · 只读' : '') + '</span>' +
      '<span class="tag">' + esc(t.domain) + '</span></div>' +
      '<div class="ds">' + esc(t.desc) + '</div>' +
    '</div>').join('') : '<div class="empty">没有匹配的工具</div>';
}

let CUR = null;
function openTool(name) {
  CUR = TOOLS.find(t => t.name === name);
  if (!CUR) return;
  $('sname').textContent = name;
  $('sdesc').textContent = CUR.desc || '';
  const b = $('sbanner');
  b.className = 'banner ' + (CUR.ro ? 'ok' : CUR.risk === 'high' ? 'warn' : 'info');
  b.textContent = CUR.ro ? '只读工具，直接执行'
    : CUR.risk === 'high' ? '高危工具：执行前需填写原因，理由会进审计'
    : '有写入：执行前需填写原因，理由会进审计';
  $('sreasonWrap').style.display = CUR.ro ? 'none' : 'block';
  $('sreason').value = '';
  $('sform').innerHTML = '<div class="fld"><label>参数（JSON）</label><textarea id="sa">{}</textarea>' +
    '<div class="sub" style="margin-top:6px">键来自工具的 params：' + esc(CUR.name) + '</div></div>';
  $('sres').style.display = 'none';
  $('mask').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet() { $('mask').classList.remove('show'); $('sheet').classList.remove('show'); }

async function run() {
  if (!CUR) return;
  let args = {};
  try { args = JSON.parse(($('sa') && $('sa').value) || '{}'); }
  catch (e) { $('sres').style.display = 'block'; $('sres').textContent = '参数不是合法 JSON：' + e.message; return; }
  const reason = ($('sreason').value || '').trim();
  if (!CUR.ro && reason.length < 2) { $('sreason').focus(); $('sreason').placeholder = '必须先写原因'; return; }
  if (reason) args._reason = reason;

  $('sgo').disabled = true;
  $('sres').style.display = 'block';
  $('sres').textContent = '执行中…';
  try {
    const res = await callTool('lemon_call', {name: CUR.name, args});
    const t = textOf(res);
    $('sres').textContent = t;
    $('sres').style.color = res.isError ? '#ff8a8d' : '#c9c9ce';
  } catch (e) {
    $('sres').textContent = '失败：' + e.message;
  } finally {
    $('sgo').disabled = false;
  }
}

$('q').addEventListener('input', render);
$('frisk').addEventListener('change', render);
loadCatalog();
</script>
</body>
</html>
