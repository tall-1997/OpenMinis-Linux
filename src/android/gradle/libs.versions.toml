[versions]
# ─────────────────────────────────────────────────────────────────────────────
# [T-version-catalog] 全仓唯一的版本来源。
#
# 规则（由 scripts/ci/check_no_inline_versions.py 强制）：
#   * 任何 build.gradle.kts 的 dependencies 块里，坐标必须是 libs.xxx 形式，
#     不允许出现 "group:artifact:1.2.3" 这种内联版本。
#   * 由 BOM 管理的坐标（androidx.compose.*）不写版本，走 libs 别名但 version 留空。
#   * 新增依赖先加到这里，再引用。
#
# 版本链条约束（实测，不是推测）：
#   material3 1.3.0+ 硬性要求 compileSdk 37 + AGP 9.1.0。
#   所以 compose-bom / material3-adaptive 的升级必须与 AGP + compileSdk 同批。
# ─────────────────────────────────────────────────────────────────────────────

# ── 构建工具链 ──────────────────────────────────────────────────────────────
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

# ── SDK 级别 ────────────────────────────────────────────────────────────────
compileSdk = "36"
targetSdk = "35"
# benchmark 模块用 28（Macrobenchmark 要求 >=28，与 app 的 26 不同）
benchmarkMinSdk = "28"
minSdk = "26"

# ── Kotlin 运行时库 ─────────────────────────────────────────────────────────
kotlinxCoroutines = "1.9.0"
kotlinxSerialization = "1.7.3"

# ── AndroidX 核心 ──────────────────────────────────────────────────────────
composeBom = "2025.09.00"
material3Adaptive = "1.2.0"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
room = "2.6.1"
browser = "1.8.0"
documentfile = "1.0.1"
webkit = "1.12.1"
exifinterface = "1.3.7"
securityCrypto = "1.1.0-alpha06"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
androidxTestUiautomator = "2.3.0"
androidxBenchmark = "1.3.3"

# ── 网络 / 解析 ────────────────────────────────────────────────────────────
okhttp = "4.12.0"
rhino = "1.7.14"
jsch = "0.2.26"
markdown = "0.7.3"

# ── 图像 ────────────────────────────────────────────────────────────────────
coil = "2.7.0"

# ── 第三方 ──────────────────────────────────────────────────────────────────
reorderable = "2.4.0"
termuxTerminalView = "0.118.0"
acra = "5.12.0"
shizuku = "13.1.5"
mlkitTextChinese = "16.0.1"
sileroVad = "1.0.5"

# ── 测试 ────────────────────────────────────────────────────────────────────
junit = "4.13.2"
mockwebserver = "4.12.0"
json = "20231013"
robolectric = "4.14.1"
# [T-vdhost] VD host 构建链的固定坐标，AGP 自带 r8 与本表保持一致
jgit = "7.8.1.202611041320-r"
r8 = "8.3.37"
robolectricAndroidAll = "14-robolectric-10818077"

# ── 插件 ────────────────────────────────────────────────────────────────────
[libraries]

# Kotlin 运行时
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose（版本由 BOM 决定，别名不带 version）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

# Compose 自适应（BOM 不管理，必须显式版本）
# 注意：别名不能含 `class` —— Gradle 的保留词，会让访问器生成失败并报
# "Alias ... is a reserved name"（不论它指向什么实际构件）。
androidx-material3-windowsize = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }
androidx-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3Adaptive" }

# AndroidX 核心
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# 网络 / 解析
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
org-json = { module = "org.json:json", version.ref = "json" }

# 图像
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }

# 第三方
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
termux-terminal-view = { module = "com.termux.termux-app:terminal-view", version.ref = "termuxTerminalView" }
acra-core = { module = "ch.acra:acra-core", version.ref = "acra" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
mlkit-text-recognition-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextChinese" }
silero-vad = { module = "com.github.helloooideeeeea:RealTimeCutVADLibraryForAndroid", version.ref = "sileroVad" }
# 测试
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
android-tools-r8 = { module = "com.android.tools:r8", version.ref = "r8" }
robolectric-android-all = { module = "org.robolectric:android-all", version.ref = "robolectricAndroidAll" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
