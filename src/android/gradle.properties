# Keep the build inside this phone's memory budget: the daemon claims 4g here
# while the Kotlin compile daemon claims its own, and Android LMK kills the
# whole foreground process group mid-build. 2g/1536m halves the peak without
# measurably slowing this project's full test run.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# First-build Maven/Gradle mirrors. auto|cn|off — see scripts/pick_build_mirrors.py
# and docs/android-sdk-mirrors.md. Do not pin a single mirror URL.
# MINIS_BUILD_MIRRORS=auto
